[package]
name = "velocidad"
version = "0.1.0"
edition = "2021"
resolver = "2"
authors = ["Adeoye Olaseni <dev@unkuseni.xyz>"]
description = "High-performance multi-chain telegram trading bot (Trojan-style) backed by libSQL/Turso"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unkuseni/velocidad"
readme = "README.md"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web API
axum = { version = "0.7", features = ["ws"] }

# Telegram bot
teloxide = { version = "0.13", features = ["macros"] }

# Database: libSQL (local file or remote Turso)
libsql = { version = "0.9", features = ["remote"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
figment = { version = "0.10", features = ["env"] }
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crypto (wallet generation + encrypted key storage)
k256 = { version = "0.13", features = ["ecdsa", "std"] }
sha3 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"

# HTTP client for DexScreener / RPC / 0x API
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# EVM transaction RLP encoding (EIP-1559)
rlp = "0.5"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Errors
anyhow = "1"
